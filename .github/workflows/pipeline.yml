name: devsecops-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: inventory-api
  TRIVY_VERSION: 0.76.1
  GITLEAKS_VERSION: 8.21.2
  CONFTEST_VERSION: 0.56.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + security rules)
        run: ruff check .
      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  secrets:
    name: Secret detection (Gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose .

  policy:
    name: Policy-as-Code (OPA / Conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install Conftest
        run: curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz conftest
      - name: Unit-test the policies
        run: ./conftest verify --policy policy
      - name: Check the rendered Helm manifests
        run: |
          helm lint charts/app
          helm template ci charts/app --set image.tag=${{ github.sha }} > rendered.yaml
          ./conftest test rendered.yaml --policy policy

  build-scan:
    name: Build image + Trivy scan + SBOM
    needs: [test, secrets, policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Trivy
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" | grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" | sha256sum -c -
          tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
      - name: Scan Dockerfile + chart for misconfigurations
        run: ./trivy config --exit-code 1 --severity HIGH,CRITICAL .
      - name: Report HIGH and CRITICAL vulnerabilities
        run: ./trivy image --severity HIGH,CRITICAL "${IMAGE_NAME}:${GITHUB_SHA}"
      - name: Fail on fixable CRITICAL vulnerabilities
        run: ./trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL "${IMAGE_NAME}:${GITHUB_SHA}"
      - name: Generate CycloneDX SBOM
        run: ./trivy image --format cyclonedx --output sbom.cdx.json "${IMAGE_NAME}:${GITHUB_SHA}"
      - name: Save image for the next jobs
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  deploy-kind:
    name: Deploy to Kubernetes (kind) + smoke test
    needs: build-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Load image into the cluster
        run: kind load image-archive image.tar --name ci
      - name: Helm install
        run: |
          helm upgrade --install inventory charts/app \
            --set image.repository=${IMAGE_NAME} \
            --set image.tag=${GITHUB_SHA} \
            --set image.pullPolicy=Never \
            --wait --timeout 3m
      - name: Smoke test through the Service
        run: |
          kubectl get pods -o wide
          kubectl port-forward svc/inventory 8080:80 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/healthz | grep -q '"ok"'
          curl -fs -X POST localhost:8080/api/items -H 'content-type: application/json' -d '{"name":"router","quantity":2}'
          curl -fs localhost:8080/api/items | grep -q router
      - name: Show events on failure
        if: failure()
        run: kubectl get events --sort-by=.lastTimestamp | tail -30

  publish:
    name: Push to GHCR + sign with Cosign (keyless)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-kind
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC token for keyless signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image (same bytes that were tested)
        id: push
        run: |
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          docker load -i image.tar
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REF}:${GITHUB_SHA}"
          docker push "${REF}:${GITHUB_SHA}" | tee push.log
          DIGEST=$(grep -oE 'digest: sha256:[a-f0-9]{64}' push.log | cut -d' ' -f2)
          test -n "$DIGEST"
          echo "digest=${REF}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Sign the image and attach the SBOM attestation
        run: |
          cosign sign --yes "${{ steps.push.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.push.outputs.digest }}"
      - name: Verify the signature
        run: |
          cosign verify "${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
